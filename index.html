<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>עץ משפחת לוי - מורשת אסתר</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    
    .tree ul {
      position: relative;
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 20px 0 0 0;
    }

    .tree > ul {
      padding-top: 0;
    }

    .tree li {
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 20px 10px 0 10px;
    }

    /* הקו האנכי היורד מההורה */
    .tree ul ul::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      height: 20px;
      border-left: 2px solid #64748b;
      transform: translateX(-50%);
    }

    /* הקו האופקי המחבר */
    .tree li::before {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      width: 50%;
      border-top: 2px solid #64748b;
    }

    .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      border-top: 2px solid #64748b;
    }

    .tree li:first-child::after { border-top: none; }
    .tree li:last-child::before { border-top: none; }
    .tree li:only-child::before, .tree li:only-child::after { border-top: none; }

    /* הקו העולה מכל כרטיס אדם */
    .node-box {
      position: relative;
      display: inline-flex;
    }

    .node-box::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 50%;
      height: 20px;
      border-left: 2px solid #64748b;
      transform: translateX(-50%);
    }

    .tree > ul > li {
      padding-top: 0;
    }

    .tree > ul > li > .node-box::before {
      display: none;
    }

    .tree-wrapper {
      min-width: max-content;
      padding: 60px;
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
    }

    #viewport {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 h-screen w-screen flex flex-col overflow-hidden">

  <!-- מסך התחברות -->
  <div id="login-screen" class="fixed inset-0 bg-amber-50/95 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl max-w-md w-full border border-amber-200 text-center">
      <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800 mb-2">עץ משפחת לוי / אזולאי</h1>
      <p class="text-gray-600 mb-6 text-sm">אנא הזן את הסיסמה המשפחתית כדי לצפות בעץ המשפחה</p>
      <form onsubmit="checkPassword(event)" class="space-y-4">
        <input type="password" id="pass-input" placeholder="הכנס סיסמה..." class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-amber-500 text-center text-lg outline-none">
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-3 rounded-xl transition shadow-md">כניסה לאתר</button>
      </form>
      <p id="error-msg" class="text-red-500 text-sm mt-3 hidden">סיסמה שגויה, נסה שוב</p>
    </div>
  </div>

  <!-- כותרת עליונה -->
  <header class="bg-white border-b border-gray-200 px-4 sm:px-6 py-3 sm:py-4 flex flex-wrap gap-2 sm:gap-4 justify-between items-center shadow-sm sticky top-0 z-30">
    <div>
      <h1 class="text-base sm:text-xl font-bold text-gray-800">עץ משפחת לוי - מורשת אסתר</h1>
      <p class="text-[10px] sm:text-xs text-gray-500">עץ אינטראקטיבי (גרירה וזום זמינים)</p>
    </div>
    <div class="flex items-center gap-2">
      <span id="sync-status" class="text-[10px] sm:text-xs px-2.5 py-1 sm:py-1.5 rounded-full bg-emerald-100 text-emerald-800 font-medium">
        🟢 מחובר
      </span>
      <button onclick="exportData()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-[10px] sm:text-xs px-2.5 py-1.5 sm:py-2 rounded-lg font-medium transition">
        📥 גיבוי
      </button>
    </div>
  </header>

  <!-- אזור העץ עם Zoom & Pan -->
  <main class="flex-1 relative overflow-hidden bg-slate-100 cursor-grab active:cursor-grabbing" id="viewport">
    
    <!-- פאנל כפתורי זום צף -->
    <div class="absolute bottom-4 left-4 z-20 flex items-center gap-1 sm:gap-2 bg-white/90 backdrop-blur-md p-1.5 sm:p-2 rounded-2xl shadow-lg border border-slate-200">
      <button onclick="zoomIn()" class="w-8 h-8 sm:w-10 sm:h-10 hover:bg-slate-100 active:bg-slate-200 rounded-xl font-bold text-slate-700 text-lg transition flex items-center justify-center" title="זום פנימה">+</button>
      <button onclick="zoomOut()" class="w-8 h-8 sm:w-10 sm:h-10 hover:bg-slate-100 active:bg-slate-200 rounded-xl font-bold text-slate-700 text-lg transition flex items-center justify-center" title="זום החוצה">-</button>
      <button onclick="resetZoom()" class="px-2.5 py-1.5 sm:px-3 sm:py-2 hover:bg-slate-100 active:bg-slate-200 rounded-xl text-xs font-semibold text-slate-700 transition" title="איפוס תצוגה">איפוס</button>
      <span id="zoom-level" class="text-[10px] sm:text-xs text-slate-500 px-1.5 font-mono min-w-[40px] text-center">100%</span>
    </div>

    <!-- המכולה הזזה והגדלה -->
    <div id="pan-target" class="absolute top-0 left-0">
      <div class="tree-wrapper" id="tree-target">
        <div class="tree" id="tree-root">
          <p class="text-gray-500 text-sm text-center pt-10">טוען נתונים...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- פאנל פרטים ועריכה צדדי (מותאם מובייל) -->
  <div id="side-panel" class="fixed inset-y-0 left-0 w-full sm:w-80 bg-white shadow-2xl border-r border-gray-200 p-6 z-40 transform -translate-x-full transition-transform duration-300 overflow-y-auto">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-lg font-bold text-gray-800">כרטיס חבר משפחה</h2>
      <button onclick="closePanel()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold p-1">&times;</button>
    </div>
    <div id="panel-content" class="space-y-4"></div>
  </div>

  <script>
    const PASSWORD = "1234";

    const BIN_ID = "6a7b00daf5f4af5e2906b819";
    const MASTER_KEY = "$2a$10$gPy46pmwZapgZP5Il488IuPH0T/sHCsecTAsuRfNaJNciKdVaVL9e";

    const defaultTree = {
      id: "root",
      name: "אסתר",
      isDirect: true,
      isDeceased: true,
      city: "ירושלים",
      marriages: [
        {
          spouse: "חנני בן עמי",
          children: [
            { id: "1", name: "ברכה", isDirect: true, city: "ירושלים", marriages: [{ spouse: "מרדכי ודעי ז\"ל", children: [{ id: "1-1", name: "סעדיה" }, { id: "1-2", name: "אילנה" }] }] },
            { id: "2", name: "יעקב ז\"ל", isDirect: true, isDeceased: true, city: "עפולה", marriages: [{ spouse: "מרגלית ז\"ל", children: [{ id: "2-1", name: "יאיר" }] }] },
            { id: "3", name: "מרים", isDirect: true, city: "ירושלים", marriages: [{ spouse: "יוסי לוי ז\"ל", children: [{ id: "3-1", name: "אילן", marriages: [{ spouse: "מירי", children: [{ id: "3-1-1", name: "עדן" }, { id: "3-1-2", name: "בר" }, { id: "3-1-3", name: "טל" }] }] }, { id: "3-2", name: "גבי", marriages: [{ spouse: "אורה" }] }, { id: "3-3", name: "סיגי" }] }] },
            { id: "4", name: "פנינה", isDirect: true, marriages: [{ spouse: "קלוד דרמוני" }] },
            { id: "5", name: "עמירם", isDirect: true, marriages: [{ spouse: "שמחה" }] },
            { id: "6", name: "שושנה", isDirect: true, marriages: [
                { spouse: "ג'ימי", children: [{ id: "6-1", name: "אייל" }, { id: "6-2", name: "רון" }] },
                { spouse: "ניסן", children: [{ id: "6-3", name: "אורלי" }, { id: "6-4", name: "קובי" }] }
              ] 
            },
            { id: "7", name: "רחל", isDirect: true, marriages: [{ spouse: "אליהו אבוטבול ז\"ל" }] },
            { id: "8", name: "דוד", isDirect: true, marriages: [{ spouse: "נילה" }] },
            { id: "9", name: "סימה", isDirect: true, marriages: [{ spouse: "שלום קיסר" }] },
            { id: "10", name: "בת שבע", isDirect: true, marriages: [{ spouse: "אדי בן חיים ז\"ל" }] },
            { id: "11", name: "רות", isDirect: true, marriages: [{ spouse: "יוחנן טולדאנו" }] }
          ]
        }
      ]
    };

    let familyTree = defaultTree;

    // --- מנגנון ZOOM & PAN ---
    let scale = 0.85;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isPanning = false;

    const viewport = document.getElementById('viewport');
    const panTarget = document.getElementById('pan-target');

    function updateTransform() {
      panTarget.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      document.getElementById('zoom-level').innerText = `${Math.round(scale * 100)}%`;
    }

    function zoomIn() {
      scale = Math.min(scale + 0.15, 2.2);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale - 0.15, 0.25);
      updateTransform();
    }

    function resetZoom() {
      scale = 0.85;
      // מרכז את העץ על המסך
      const viewportRect = viewport.getBoundingClientRect();
      const treeRect = document.getElementById('tree-target').getBoundingClientRect();
      pointX = (viewportRect.width - treeRect.width * scale) / 2;
      pointY = 40;
      updateTransform();
    }

    // אירועי עכבר (Desktop)
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node-box') || e.target.closest('#side-panel')) return;
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const newScale = Math.min(Math.max(scale * zoomFactor, 0.25), 2.2);

      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      pointX = mouseX - (mouseX - pointX) * (newScale / scale);
      pointY = mouseY - (mouseY - pointY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }, { passive: false });

    // אירועי מגע (Mobile Touch)
    let initialPinchDistance = null;

    viewport.addEventListener('touchstart', (e) => {
      if (e.target.closest('.node-box') || e.target.closest('#side-panel')) return;
      if (e.touches.length === 1) {
        isPanning = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      } else if (e.touches.length === 2) {
        isPanning = false;
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    viewport.addEventListener('touchmove', (e) => {
      if (isPanning && e.touches.length === 1) {
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialPinchDistance;
        scale = Math.min(Math.max(scale * factor, 0.25), 2.2);
        initialPinchDistance = currentDistance;
        updateTransform();
      }
    }, { passive: true });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) isPanning = false;
    });

    // --- טעינת נתונים וסנכרון ענן ---
    async function loadTreeFromCloud() {
      const statusEl = document.getElementById('sync-status');
      try {
        statusEl.innerHTML = "⏳ מסנכרן...";
        statusEl.className = "text-[10px] sm:text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-medium";

        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        const data = await res.json();
        
        if (data.record && data.record.id === "root") {
          familyTree = data.record;
        } else {
          await saveTreeToCloud();
        }
        
        statusEl.innerHTML = "🟢 מסונכרן";
        statusEl.className = "text-[10px] sm:text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-medium";
      } catch (err) {
        console.error("שגיאה בטעינת הענן:", err);
        statusEl.innerHTML = "⚠️ מצב מקומי";
        statusEl.className = "text-[10px] sm:text-xs px-2.5 py-1 rounded-full bg-red-100 text-red-800 font-medium";
      }
      renderFullTree();
      setTimeout(resetZoom, 100);
    }

    async function saveTreeToCloud() {
      const statusEl = document.getElementById('sync-status');
      try {
        statusEl.innerHTML = "💾 שומר...";
        statusEl.className = "text-[10px] sm:text-xs px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 font-medium";

        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify(familyTree)
        });

        statusEl.innerHTML = "🟢 נשמר";
        statusEl.className = "text-[10px] sm:text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-medium";
      } catch (err) {
        console.error("שגיאה בשמירה לענן:", err);
        statusEl.innerHTML = "❌ שגיאה בשמירה";
        statusEl.className = "text-[10px] sm:text-xs px-2.5 py-1 rounded-full bg-red-100 text-red-800 font-medium";
      }
      renderFullTree();
    }

    function checkPassword(e) {
      e.preventDefault();
      if (document.getElementById('pass-input').value === PASSWORD) {
        document.getElementById('login-screen').classList.add('hidden');
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    }

    function renderNode(node) {
      let html = '<li>';
      
      html += `<div class="node-box gap-1 items-center bg-white p-1 rounded-xl shadow-md border border-slate-300 relative z-10">
        <div onclick='openPanel("${node.id}")' class="px-3 py-1.5 rounded-lg cursor-pointer transition font-semibold text-xs sm:text-sm whitespace-nowrap ${node.isDirect !== false ? 'bg-amber-300 text-amber-950 hover:bg-amber-400' : 'bg-slate-200 hover:bg-slate-300'}">
          ${node.name}
        </div>`;

      if (node.marriages && node.marriages.length > 0) {
        node.marriages.forEach((m, mIdx) => {
          if (m.spouse) {
            html += `<div onclick='openPanel("${node.id}", ${mIdx})' class="bg-slate-200 text-slate-800 hover:bg-slate-300 px-2.5 py-1.5 rounded-lg cursor-pointer text-xs sm:text-sm whitespace-nowrap">
              ${m.spouse}
            </div>`;
          }
        });
      }
      html += '</div>';

      if (node.marriages && node.marriages.length > 0) {
        const marriagesWithKids = node.marriages.filter(m => m.children && m.children.length > 0);
        
        if (marriagesWithKids.length > 1) {
          html += '<ul>';
          marriagesWithKids.forEach(m => {
            html += `<li>
              <div class="node-box">
                <span class="bg-slate-200 text-slate-700 text-[10px] sm:text-xs px-2 py-0.5 rounded-full border border-slate-300 font-medium">
                  מנישואים ל: ${m.spouse || 'בן/בת זוג'}
                </span>
              </div>
              <ul>`;
            m.children.forEach(child => {
              html += renderNode(child);
            });
            html += `</ul></li>`;
          });
          html += '</ul>';
        } else if (marriagesWithKids.length === 1) {
          html += '<ul>';
          marriagesWithKids[0].children.forEach(child => {
            html += renderNode(child);
          });
          html += '</ul>';
        }
      }

      html += '</li>';
      return html;
    }

    function renderFullTree() {
      document.getElementById('tree-root').innerHTML = '<ul>' + renderNode(familyTree) + '</ul>';
    }

    function findNode(node, id) {
      if (node.id === id) return node;
      if (node.marriages) {
        for (let m of node.marriages) {
          if (m.children) {
            for (let child of m.children) {
              let found = findNode(child, id);
              if (found) return found;
            }
          }
        }
      }
      return null;
    }

    function deleteNode(node, id) {
      if (!node.marriages) return false;
      for (let m of node.marriages) {
        if (m.children) {
          const idx = m.children.findIndex(c => c.id === id);
          if (idx !== -1) {
            m.children.splice(idx, 1);
            return true;
          }
          for (let child of m.children) {
            if (deleteNode(child, id)) return true;
          }
        }
      }
      return false;
    }

    function openPanel(nodeId, marriageIdx = null) {
      const person = findNode(familyTree, nodeId);
      const content = document.getElementById('panel-content');
      if (!person) return;

      if (!person.marriages) person.marriages = [{ spouse: "", children: [] }];

      content.innerHTML = `
        <div class="flex flex-col items-center gap-3 p-4 bg-amber-50 rounded-2xl border border-amber-200 text-center">
          <div class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-full overflow-hidden border-2 border-amber-400 bg-amber-100 flex items-center justify-center text-amber-800 font-bold text-2xl sm:text-3xl shadow-sm">
            ${person.photo 
              ? `<img src="${person.photo}" alt="${person.name}" class="w-full h-full object-cover">` 
              : `<span>${person.name[0]}</span>`}
          </div>
          <div>
            <h3 class="font-bold text-gray-900 text-base sm:text-lg">${person.name}</h3>
            <span class="text-[10px] sm:text-xs px-2.5 py-0.5 rounded-full ${person.isDirect !== false ? 'bg-amber-200 text-amber-800' : 'bg-slate-200 text-slate-800'}">
              ${person.isDirect !== false ? 'צאצא ישיר' : 'בן/בת זוג'}
            </span>
          </div>
          <label class="cursor-pointer bg-white border border-amber-300 text-amber-800 text-xs px-3 py-1.5 rounded-lg hover:bg-amber-100 font-medium transition shadow-sm">
            📷 העלה/שנה תמונה
            <input type="file" accept="image/*" class="hidden" onchange="uploadPhoto(event, '${person.id}')">
          </label>
        </div>

        <div class="space-y-3 border-b pb-4">
          <h4 class="font-bold text-xs text-gray-500">פרטים אישיים:</h4>
          <div>
            <label class="block text-xs text-gray-600">שם מלא:</label>
            <input type="text" id="edit-name" value="${person.name}" class="w-full px-3 py-1.5 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs text-gray-600">עיר מגורים:</label>
            <input type="text" id="edit-city" value="${person.city || ''}" class="w-full px-3 py-1.5 border rounded-lg text-sm">
          </div>
          <button onclick="savePersonDetails('${person.id}')" class="w-full bg-amber-500 text-white py-2 rounded-lg text-sm font-medium hover:bg-amber-600 shadow-sm">שמור פרטים</button>
        </div>

        <div class="space-y-3 border-b pb-4">
          <h4 class="font-bold text-xs text-gray-500">בני/בנות זוג:</h4>
          ${person.marriages.map((m, idx) => `
            <div class="p-2 bg-slate-50 border rounded-lg space-y-2">
              <label class="block text-xs text-gray-500">בן/בת זוג #${idx + 1}:</label>
              <input type="text" id="spouse-${idx}" value="${m.spouse || ''}" placeholder="שם בן/בת הזוג..." class="w-full px-2.5 py-1 border rounded text-sm">
            </div>
          `).join('')}
          <button onclick="addSpouseSession('${person.id}')" class="w-full bg-slate-200 text-slate-700 py-1.5 rounded-lg text-xs font-medium hover:bg-slate-300">+ הוסף בן/בת זוג נוסף</button>
          <button onclick="saveSpouses('${person.id}')" class="w-full bg-amber-500 text-white py-2 rounded-lg text-sm font-medium hover:bg-amber-600 shadow-sm">שמור נישואים</button>
        </div>

        <div class="space-y-3 border-b pb-4">
          <h4 class="font-bold text-xs text-gray-500">הוספת צאצא (ילד/ה):</h4>
          <div>
            <label class="block text-xs text-gray-600">בחר מערכת נישואים:</label>
            <select id="child-marriage-idx" class="w-full px-2.5 py-1.5 border rounded-lg text-sm bg-white">
              ${person.marriages.map((m, idx) => `
                <option value="${idx}">מנישואים ל: ${m.spouse || 'ללא שם (' + (idx+1) + ')'}</option>
              `).join('')}
            </select>
          </div>
          <input type="text" id="new-child-name" placeholder="שם הילד/ה..." class="w-full px-3 py-1.5 border rounded-lg text-sm">
          <button onclick="addChild('${person.id}')" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-emerald-700 shadow-sm">+ הוסף צאצא לעץ</button>
        </div>

        ${person.id !== 'root' ? `
          <div class="pt-2">
            <button onclick="removePerson('${person.id}')" class="w-full bg-red-100 text-red-600 hover:bg-red-200 py-2.5 rounded-lg text-xs font-bold transition">
              🗑️ מחק אדם זה מהעץ
            </button>
          </div>
        ` : ''}
      `;

      document.getElementById('side-panel').classList.remove('-translate-x-full');
    }

    function uploadPhoto(event, nodeId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 180;
            canvas.height = 180;
            ctx.drawImage(img, 0, 0, 180, 180);
            
            const compressedPhoto = canvas.toDataURL('image/jpeg', 0.7);
            const person = findNode(familyTree, nodeId);
            if (person) {
              person.photo = compressedPhoto;
              saveTreeToCloud();
              openPanel(nodeId);
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function savePersonDetails(id) {
      const p = findNode(familyTree, id);
      if (p) {
        p.name = document.getElementById('edit-name').value;
        p.city = document.getElementById('edit-city').value;
        saveTreeToCloud();
        openPanel(id);
      }
    }

    function addSpouseSession(id) {
      const p = findNode(familyTree, id);
      if (p) {
        if (!p.marriages) p.marriages = [];
        p.marriages.push({ spouse: "", children: [] });
        saveTreeToCloud();
        openPanel(id);
      }
    }

    function saveSpouses(id) {
      const p = findNode(familyTree, id);
      if (p && p.marriages) {
        p.marriages.forEach((m, idx) => {
          const el = document.getElementById(`spouse-${idx}`);
          if (el) m.spouse = el.value;
        });
        saveTreeToCloud();
        openPanel(id);
      }
    }

    function addChild(id) {
      const childName = document.getElementById('new-child-name').value.trim();
      const mIdx = parseInt(document.getElementById('child-marriage-idx').value);
      if (!childName) return;

      const p = findNode(familyTree, id);
      if (p && p.marriages[mIdx]) {
        if (!p.marriages[mIdx].children) p.marriages[mIdx].children = [];
        p.marriages[mIdx].children.push({
          id: Date.now().toString(),
          name: childName,
          isDirect: true,
          marriages: [{ spouse: "", children: [] }]
        });
        saveTreeToCloud();
        openPanel(id);
      }
    }

    function removePerson(id) {
      if (confirm("האם אתה בטוח שברצונך למחוק אדם זה מהעץ?")) {
        deleteNode(familyTree, id);
        saveTreeToCloud();
        closePanel();
      }
    }

    function closePanel() {
      document.getElementById('side-panel').classList.add('-translate-x-full');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(familyTree, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "family_tree_data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    loadTreeFromCloud();
  </script>
</body>
</html>
