<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עץ משפחת לוי - מורשת אסתר</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; overflow-x: auto; }
    
    /* מבנה העץ הבסיסי */
    .tree ul {
      padding-top: 20px;
      position: relative;
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    .tree li {
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 20px 10px 0 10px;
    }

    /* 1. קו אנכי יורד מההורה אל ציר האחים */
    .tree ul ul::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      height: 20px;
      border-left: 2px solid #64748b;
      transform: translateX(-50%);
    }

    /* 2. ציר אופקי המחבר בין האחים */
    .tree li::before {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      width: 50%;
      border-top: 2px solid #64748b;
    }

    .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      border-top: 2px solid #64748b;
    }

    /* הסרת עודפים אופקיים בקצוות בלבד (בלי לפגוע בקווים האנכיים) */
    .tree li:first-child::before { border-top: none; }
    .tree li:last-child::after { border-top: none; }
    .tree li:only-child::before, .tree li:only-child::after { border-top: none; }

    /* 3. קו אנכי יורד מהציר האופקי ישירות לכל קוביה */
    .node-box {
      position: relative;
      display: inline-flex;
    }

    .node-box::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 50%;
      height: 20px;
      border-left: 2px solid #64748b;
      transform: translateX(-50%);
    }

    /* הסרת הקו האנכי רק מעל ראש העץ (אסתר) */
    .tree > ul > li > .node-box::before {
      display: none;
    }

    .tree-wrapper {
      min-width: max-content;
      padding: 40px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

  <!-- מסך התחברות -->
  <div id="login-screen" class="fixed inset-0 bg-amber-50/95 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-amber-200 text-center">
      <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
      <h1 class="text-2xl font-bold text-gray-800 mb-2">עץ משפחת לוי / אזולאי</h1>
      <p class="text-gray-600 mb-6 text-sm">אנא הזן את הסיסמה המשפחתית כדי לצפות בעץ המשפחה</p>
      <form onsubmit="checkPassword(event)" class="space-y-4">
        <input type="password" id="pass-input" placeholder="הכנס סיסמה..." class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-amber-500 text-center text-lg outline-none">
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-3 rounded-xl transition shadow-md">כניסה לאתר</button>
      </form>
      <p id="error-msg" class="text-red-500 text-sm mt-3 hidden">סיסמה שגויה, נסה שוב</p>
    </div>
  </div>

  <!-- כותרת עליונה -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex flex-wrap gap-4 justify-between items-center shadow-sm sticky top-0 z-30">
    <div>
      <h1 class="text-xl font-bold text-gray-800">עץ משפחת לוי - מורשת אסתר</h1>
      <p class="text-xs text-gray-500">עץ אינטראקטיבי דיגיטלי</p>
    </div>
    <div class="flex gap-2">
      <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition shadow-sm">
        📥 הורד גיבוי נתונים
      </button>
      <button onclick="resetData()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-3 py-2 rounded-lg font-medium transition">
        🔄 איפוס לברירת מחדל
      </button>
    </div>
  </header>

  <!-- אזור העץ -->
  <main class="flex-1 overflow-auto w-full">
    <div class="tree-wrapper flex justify-center">
      <div class="tree" id="tree-root"></div>
    </div>
  </main>

  <!-- פאנל פרטים ועריכה צדדי -->
  <div id="side-panel" class="fixed inset-y-0 left-0 w-80 bg-white shadow-2xl border-r border-gray-200 p-6 z-40 transform -translate-x-full transition-transform duration-300 overflow-y-auto">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-lg font-bold text-gray-800">כרטיס חבר משפחה</h2>
      <button onclick="closePanel()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
    </div>
    <div id="panel-content" class="space-y-4"></div>
  </div>

  <script>
    const PASSWORD = "1234";

    const defaultTree = {
      id: "root",
      name: "אסתר",
      isDirect: true,
      isDeceased: true,
      city: "ירושלים",
      marriages: [
        {
          spouse: "חנני בן עמי",
          children: [
            { id: "1", name: "ברכה", isDirect: true, city: "ירושלים", marriages: [{ spouse: "מרדכי ודעי ז\"ל", children: [{ id: "1-1", name: "סעדיה" }, { id: "1-2", name: "אילנה" }] }] },
            { id: "2", name: "יעקב ז\"ל", isDirect: true, isDeceased: true, city: "עפולה", marriages: [{ spouse: "מרים", children: [{ id: "2-1", name: "יאיר" }] }] },
            { id: "3", name: "מרים", isDirect: true, city: "ירושלים", marriages: [{ spouse: "יוסי לוי ז\"ל", children: [{ id: "3-1", name: "אילן", marriages: [{ spouse: "מירי", children: [{ id: "3-1-1", name: "טל" }, { id: "3-1-2", name: "בר" }, { id: "3-1-3", name: "עדן" }] }] }, { id: "3-2", name: "גבי", marriages: [{ spouse: "אורה" }] }, { id: "3-3", name: "סיגי" }] }] },
            { id: "4", name: "פנינה", isDirect: true, marriages: [{ spouse: "קלוד דרמוני" }] },
            { id: "5", name: "עמירם", isDirect: true, marriages: [{ spouse: "שמחה" }] },
            { id: "6", name: "שושנה", isDirect: true, marriages: [{ spouse: "ג'ימי" }] },
            { id: "7", name: "רחל", isDirect: true, marriages: [{ spouse: "אליהו אבוטבול ז\"ל" }] },
            { id: "8", name: "דוד", isDirect: true, marriages: [{ spouse: "נילה" }] },
            { id: "9", name: "סימה", isDirect: true, marriages: [{ spouse: "שלום קיסר" }] },
            { id: "10", name: "בת שבע", isDirect: true, marriages: [{ spouse: "אדי בן חיים ז\"ל" }] },
            { id: "11", name: "רות", isDirect: true, marriages: [{ spouse: "יוחנן טולדאנו" }] }
          ]
        }
      ]
    };

    let familyTree = JSON.parse(localStorage.getItem('familyTreeData')) || defaultTree;

    function saveTree() {
      localStorage.setItem('familyTreeData', JSON.stringify(familyTree));
      renderFullTree();
    }

    function checkPassword(e) {
      e.preventDefault();
      if (document.getElementById('pass-input').value === PASSWORD) {
        document.getElementById('login-screen').classList.add('hidden');
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    }

    function renderNode(node) {
      let html = '<li>';
      
      // קובית אדם + בני זוג
      html += `<div class="node-box gap-1 items-center bg-white p-1.5 rounded-xl shadow border border-slate-300 relative z-10">
        <div onclick='openPanel("${node.id}")' class="px-3.5 py-1.5 rounded-lg cursor-pointer transition font-semibold text-sm ${node.isDirect !== false ? 'bg-amber-300 text-amber-950 hover:bg-amber-400' : 'bg-slate-200 hover:bg-slate-300'}">
          ${node.name}
        </div>`;

      if (node.marriages && node.marriages.length > 0) {
        node.marriages.forEach((m, mIdx) => {
          if (m.spouse) {
            html += `<div onclick='openPanel("${node.id}", ${mIdx})' class="bg-slate-200 text-slate-800 hover:bg-slate-300 px-3 py-1.5 rounded-lg cursor-pointer text-sm">
              ${m.spouse}
            </div>`;
          }
        });
      }
      html += '</div>';

      // איגוד הילדים תחת תגית ul אחת
      let allChildren = [];
      if (node.marriages) {
        node.marriages.forEach(m => {
          if (m.children && m.children.length > 0) {
            allChildren = allChildren.concat(m.children);
          }
        });
      }

      if (allChildren.length > 0) {
        html += '<ul>';
        allChildren.forEach(child => {
          html += renderNode(child);
        });
        html += '</ul>';
      }

      html += '</li>';
      return html;
    }

    function renderFullTree() {
      document.getElementById('tree-root').innerHTML = '<ul>' + renderNode(familyTree) + '</ul>';
    }

    function findNode(node, id) {
      if (node.id === id) return node;
      if (node.marriages) {
        for (let m of node.marriages) {
          if (m.children) {
            for (let child of m.children) {
              let found = findNode(child, id);
              if (found) return found;
            }
          }
        }
      }
      return null;
    }

    function deleteNode(node, id) {
      if (!node.marriages) return false;
      for (let m of node.marriages) {
        if (m.children) {
          const idx = m.children.findIndex(c => c.id === id);
          if (idx !== -1) {
            m.children.splice(idx, 1);
            return true;
          }
          for (let child of m.children) {
            if (deleteNode(child, id)) return true;
          }
        }
      }
      return false;
    }

    function openPanel(nodeId, marriageIdx = null) {
      const person = findNode(familyTree, nodeId);
      const content = document.getElementById('panel-content');
      if (!person) return;

      if (!person.marriages) person.marriages = [{ spouse: "", children: [] }];

      content.innerHTML = `
        <div class="p-3 bg-amber-50 rounded-xl border border-amber-200">
          <h3 class="font-bold text-gray-900 text-lg">${person.name}</h3>
          <span class="text-xs px-2 py-0.5 rounded-full ${person.isDirect !== false ? 'bg-amber-200 text-amber-800' : 'bg-slate-200 text-slate-800'}">
            ${person.isDirect !== false ? 'צאצא ישיר' : 'בן/בת זוג'}
          </span>
        </div>

        <div class="space-y-3 border-b pb-4">
          <h4 class="font-bold text-xs text-gray-500">פרטים אישיים:</h4>
          <div>
            <label class="block text-xs text-gray-600">שם מלא:</label>
            <input type="text" id="edit-name" value="${person.name}" class="w-full px-3 py-1.5 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs text-gray-600">עיר מגורים:</label>
            <input type="text" id="edit-city" value="${person.city || ''}" class="w-full px-3 py-1.5 border rounded-lg text-sm">
          </div>
          <button onclick="savePersonDetails('${person.id}')" class="w-full bg-amber-500 text-white py-1.5 rounded-lg text-sm font-medium hover:bg-amber-600 shadow-sm">שמור פרטים</button>
        </div>

        <div class="space-y-3 border-b pb-4">
          <h4 class="font-bold text-xs text-gray-500">בני/בנות זוג:</h4>
          ${person.marriages.map((m, idx) => `
            <div class="p-2 bg-slate-50 border rounded-lg space-y-2">
              <label class="block text-xs text-gray-500">בן/בת זוג #${idx + 1}:</label>
              <input type="text" id="spouse-${idx}" value="${m.spouse || ''}" placeholder="שם בן/בת הזוג..." class="w-full px-2.5 py-1 border rounded text-sm">
            </div>
          `).join('')}
          <button onclick="addSpouseSession('${person.id}')" class="w-full bg-slate-200 text-slate-700 py-1.5 rounded-lg text-xs font-medium hover:bg-slate-300">+ הוסף בן/בת זוג נוסף (נישואים שניים)</button>
          <button onclick="saveSpouses('${person.id}')" class="w-full bg-amber-500 text-white py-1.5 rounded-lg text-sm font-medium hover:bg-amber-600 shadow-sm">שמור נישואים</button>
        </div>

        <div class="space-y-3 border-b pb-4">
          <h4 class="font-bold text-xs text-gray-500">הוספת צאצא (ילד/ה):</h4>
          <div>
            <label class="block text-xs text-gray-600">בחר מערכת נישואים:</label>
            <select id="child-marriage-idx" class="w-full px-2.5 py-1.5 border rounded-lg text-sm bg-white">
              ${person.marriages.map((m, idx) => `
                <option value="${idx}">מנישואים ל: ${m.spouse || 'ללא שם (' + (idx+1) + ')'}</option>
              `).join('')}
            </select>
          </div>
          <input type="text" id="new-child-name" placeholder="שם הילד/ה..." class="w-full px-3 py-1.5 border rounded-lg text-sm">
          <button onclick="addChild('${person.id}')" class="w-full bg-emerald-600 text-white py-1.5 rounded-lg text-sm font-medium hover:bg-emerald-700 shadow-sm">+ הוסף צאצא לעץ</button>
        </div>

        ${person.id !== 'root' ? `
          <div class="pt-2">
            <button onclick="removePerson('${person.id}')" class="w-full bg-red-100 text-red-600 hover:bg-red-200 py-2 rounded-lg text-xs font-bold transition">
              🗑️ מחק אדם זה מהעץ
            </button>
          </div>
        ` : ''}
      `;

      document.getElementById('side-panel').classList.remove('-translate-x-full');
    }

    function savePersonDetails(id) {
      const p = findNode(familyTree, id);
      if (p) {
        p.name = document.getElementById('edit-name').value;
        p.city = document.getElementById('edit-city').value;
        saveTree();
        openPanel(id);
      }
    }

    function addSpouseSession(id) {
      const p = findNode(familyTree, id);
      if (p) {
        if (!p.marriages) p.marriages = [];
        p.marriages.push({ spouse: "", children: [] });
        saveTree();
        openPanel(id);
      }
    }

    function saveSpouses(id) {
      const p = findNode(familyTree, id);
      if (p && p.marriages) {
        p.marriages.forEach((m, idx) => {
          const el = document.getElementById(`spouse-${idx}`);
          if (el) m.spouse = el.value;
        });
        saveTree();
        openPanel(id);
      }
    }

    function addChild(id) {
      const childName = document.getElementById('new-child-name').value.trim();
      const mIdx = parseInt(document.getElementById('child-marriage-idx').value);
      if (!childName) return;

      const p = findNode(familyTree, id);
      if (p && p.marriages[mIdx]) {
        if (!p.marriages[mIdx].children) p.marriages[mIdx].children = [];
        p.marriages[mIdx].children.push({
          id: Date.now().toString(),
          name: childName,
          isDirect: true,
          marriages: [{ spouse: "", children: [] }]
        });
        saveTree();
        openPanel(id);
      }
    }

    function removePerson(id) {
      if (confirm("האם אתה בטוח שברצונך למחוק אדם זה מהעץ?")) {
        deleteNode(familyTree, id);
        saveTree();
        closePanel();
      }
    }

    function closePanel() {
      document.getElementById('side-panel').classList.add('-translate-x-full');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(familyTree, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "family_tree_data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function resetData() {
      if (confirm("האם לאפס את הנתונים לנתוני המקור?")) {
        localStorage.removeItem('familyTreeData');
        familyTree = defaultTree;
        saveTree();
        closePanel();
      }
    }

    renderFullTree();
  </script>
</body>
</html>
